name: Build

# The tag job attaches packages to the GitHub release, which needs
# write access to repository contents (releases included).
permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  # Same Electron source on every OS; only the packaging target differs.
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder: "--linux AppImage tar.gz"
            artifact: parnassus-linux
            packages: |
              dist/*.AppImage
              dist/*.tar.gz
          - os: macos-latest
            builder: "--mac dmg zip"
            artifact: parnassus-macos
            packages: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            builder: "--win nsis zip"
            artifact: parnassus-windows
            packages: |
              dist/*.exe
              dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Build the app
        run: bun run build
      - name: Build packages
        run: bun x electron-builder ${{ matrix.builder }} --publish never
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.packages }}
      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.packages }}

  # Optional: builds the Flatpak from the tar.gz package on release tags.
  # The manifest expects the tarball next to it as parnassus.tar.gz.
  flatpak:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test-and-package
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Download the Linux packages
        uses: actions/download-artifact@v4
        with:
          name: parnassus-linux
          path: release
      - name: Place the tarball next to the manifest
        run: cp release/*.tar.gz flatpak/parnassus.tar.gz
      - name: Build the Flatpak
        uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: parnassus.flatpak
          manifest-path: flatpak/io.github.dmytroportianka.Parnassus.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Upload the Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: parnassus-flatpak
          path: parnassus.flatpak
