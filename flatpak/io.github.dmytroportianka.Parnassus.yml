app-id: io.github.dmytroportianka.Parnassus
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "24.08"
command: parnassus
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  # Deliberately no broad filesystem access: Parnassus is built on explicit
  # copy-in through the file picker (the document portal in Flatpak), never
  # on standing access to the user's folders.
modules:
  - name: parnassus
    buildsystem: simple
    build-commands:
      - tar -xzf parnassus.tar.gz -C /app
      - install -Dm644 io.github.dmytroportianka.Parnassus.desktop /app/share/applications/io.github.dmytroportianka.Parnassus.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.dmytroportianka.Parnassus.png
      - install -Dm755 parnassus.sh /app/bin/parnassus
    sources:
      # The tar.gz produced by the package job (electron-builder), placed
      # next to this manifest. In CI the flatpak job does the copying.
      - type: file
        path: parnassus.tar.gz
      - type: file
        path: io.github.dmytroportianka.Parnassus.desktop
      - type: file
        path: parnassus.sh
      - type: file
        path: icon.png
